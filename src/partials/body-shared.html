<!--
  GTM <noscript> fallback, injected immediately after <body> at the
  "shared-body" marker by the sharedBody plugin in vite.config.ts.
  Matching <script> snippet: src/partials/head-shared.html.

  This has no way to check whether VITE_GTM_ID is set (it only runs when
  JS is off, so the "if" trick the head snippet uses doesn't apply here)
  — with it blank, the iframe just requests an empty container id, which
  GTM ignores. Harmless, but fill in VITE_GTM_ID before relying on this.
-->
<noscript>
  <iframe
    src="https://www.googletagmanager.com/ns.html?id=%VITE_GTM_ID%"
    height="0"
    width="0"
    style="display: none; visibility: hidden"
  ></iframe>
</noscript>
