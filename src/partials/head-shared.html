<!--
  Injected into every page's head at its "shared-head" marker comment by
  the sharedHead plugin in vite.config.ts, so favicons, fonts and
  analytics only live in one place.
-->
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="icon" type="image/png" sizes="180x180" href="/favicon-180.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Public+Sans:wght@400;500;600&display=swap"
  rel="stylesheet"
/>
<!--
  Analytics — GA4 + Meta Pixel.

  IDs come from Cloudflare Pages build environment variables so no
  account IDs live in source: Pages project → Settings → Environment
  variables → add VITE_GA4_ID and/or VITE_META_PIXEL_ID, then redeploy.

  Leaving either var unset is safe: the corresponding "if" below is
  false at build time and that script never runs. No placeholder IDs
  to remember to swap out before launch.
-->
<script>
  if ('%VITE_GA4_ID%') {
    var gaScript = document.createElement('script');
    gaScript.async = true;
    gaScript.src = 'https://www.googletagmanager.com/gtag/js?id=%VITE_GA4_ID%';
    document.head.appendChild(gaScript);

    window.dataLayer = window.dataLayer || [];
    window.gtag = function gtag() { window.dataLayer.push(arguments); };
    window.gtag('js', new Date());
    window.gtag('config', '%VITE_GA4_ID%');
  }

  if ('%VITE_META_PIXEL_ID%') {
    !function (f, b, e, v, n, t, s) {
      if (f.fbq) return; n = f.fbq = function () {
        n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments);
      };
      if (!f._fbq) f._fbq = n; n.push = n; n.loaded = !0; n.version = '2.0';
      n.queue = []; t = b.createElement(e); t.async = !0; t.src = v;
      s = b.getElementsByTagName(e)[0]; s.parentNode.insertBefore(t, s);
    }(window, document, 'script', 'https://connect.facebook.net/en_US/fbevents.js');
    window.fbq('init', '%VITE_META_PIXEL_ID%');
    window.fbq('track', 'PageView');
  }
</script>
