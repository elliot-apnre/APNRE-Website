      "/mount-gambier/", "/privacy/" and "/thank-you/" (see rollupOptions.input

      so keep it self-contained and only reference files in public/.

    <style>
      :root {
        --lime: #8dc600;
        --lime-light: #a3d93a;
        --charcoal-900: #17171a;
        --grey-mid: #6d6e71;
        --paper: #f6f4ee;
        --font-display: 'Archivo', 'Arial Narrow', sans-serif;
        --font-body: 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        font-family: var(--font-body);
        background: var(--paper);
        color: var(--charcoal-900);
        -webkit-font-smoothing: antialiased;
        line-height: 1.5;
        text-align: center;
      }
      main { max-width: 520px; }
      .logo {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        margin: 0 auto 32px;
        text-decoration: none;
        color: var(--charcoal-900);
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 22px;
        letter-spacing: 0.01em;
        text-transform: uppercase;
      }
      .logo img { width: 180px; height: auto; display: block; }
      .code {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 14px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--charcoal-900);
        margin: 0 0 12px;
      }
      h1 {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: clamp(32px, 7vw, 48px);
        line-height: 1.05;
        letter-spacing: -0.01em;
        margin: 0 0 16px;
      }
      p { margin: 0 0 32px; color: var(--grey-mid); }
      a.button {
        display: inline-block;
        padding: 14px 28px;
        background: var(--lime);
        color: var(--charcoal-900);
        font-weight: 600;
        text-decoration: none;
        border-radius: 3px;
      }
      a.button:hover, a.button:focus-visible { background: var(--lime-light); }

    <main>
      <a class="logo" href="/"><img src="/apn-logo-full.png" alt="Adelaide Property Network — APN Real Estate" width="180" height="120" /></a>

      <h1>We couldn't find that page</h1>
      <p>The link may be out of date, or the address may have been mistyped.</p>
      <a class="button" href="/">Back to APN Real Estate</a>
